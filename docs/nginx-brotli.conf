# Configuração Nginx para Brotli Compression
# Aplicar ao servidor que hospeda o site zacon.com.br
#
# IMPORTANTE: Requer módulo ngx_brotli instalado no Nginx
# Instalação Ubuntu/Debian: sudo apt install nginx-module-brotli
# Ou compilar do fonte: https://github.com/google/ngx_brotli

# Carregar módulo Brotli (adicionar em /etc/nginx/nginx.conf)
# load_module modules/ngx_http_brotli_filter_module.so;
# load_module modules/ngx_http_brotli_static_module.so;

# Bloco de configuração para adicionar ao server {} do site
# ============================================================

# Habilitar Brotli
brotli on;
brotli_comp_level 6;  # Nível de compressão (1-11, 6 é bom equilíbrio)
brotli_static on;     # Servir arquivos .br pré-comprimidos se existirem
brotli_types
    text/plain
    text/css
    text/javascript
    text/xml
    text/x-component
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/rss+xml
    application/atom+xml
    application/vnd.ms-fontobject
    application/x-font-ttf
    application/x-font-opentype
    application/x-font-truetype
    image/svg+xml
    image/x-icon
    image/vnd.microsoft.icon
    font/ttf
    font/eot
    font/otf
    font/opentype;

# Manter gzip como fallback para navegadores antigos
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/javascript
    text/xml
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/rss+xml
    application/atom+xml
    image/svg+xml;

